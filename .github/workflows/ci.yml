name: CI

on:
  pull_request:
    branches: [ Dev, main ]
    paths-ignore: ['**.md']
  push:
    branches: [ Dev, main ]
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pull requests from forks never run on the self-hosted runners.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'plus-ci' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test release publication
        run: python3 .github/scripts/test_publish_release.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: corepack yarn install --immutable

      - name: Test
        run: yarn test

      - name: Compile
        run: yarn compile

      - name: Build
        run: yarn build
