name: CI

on:
  pull_request:
    branches: [ Dev, main ]
  push:
    branches: [ Dev, main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test release publication
        run: python3 .github/scripts/test_publish_release.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: corepack yarn install --immutable

      - name: Test
        run: yarn test

      - name: Compile
        run: yarn compile

      - name: Build
        run: yarn build
