name: Build & Publish Renderer Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: 'Exact main commit to release (used by upstream sync); empty uses the selected ref.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: renderer-release
  # Keep queued merges instead of replacing the previous pending release.
  queue: max
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  build-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout renderer
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          corepack yarn install --immutable

      - name: Test
        run: corepack yarn test

      - name: Compile
        run: corepack yarn compile

      - name: Build renderer
        run: corepack yarn build

      - name: Package dist
        run: (cd dist && zip -qr ../volt-renderer.zip .)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          commit=$(git rev-parse HEAD)
          tag="renderer-v$version-${commit::7}"
          bash .github/scripts/publish-release.sh "$tag" "Volt renderer $version (${commit::7})" "$commit" volt-renderer.zip
