name: Build & Publish Renderer Release

# Releases are cut by hand once a batch of changes is ready (Actions > Release > Run workflow).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version change
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      commit:
        description: 'Exact main commit to release (used by upstream sync); empty uses the selected ref.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: renderer-release
  # Keep queued merges instead of replacing the previous pending release.
  queue: max
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  build-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout renderer
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0

      - name: Select release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          commit=$(git rev-parse HEAD)
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate | jq -s '.' | python3 .github/scripts/release-version.py "$BUMP" "$commit")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          corepack yarn install --immutable

      - name: Test
        run: corepack yarn test

      - name: Compile
        run: corepack yarn compile

      - name: Build renderer
        run: corepack yarn build

      - name: Package dist
        run: (cd dist && zip -qr ../volt-renderer.zip .)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          bash .github/scripts/publish-release.sh "$TAG" "Volt Renderer $TAG" "$(git rev-parse HEAD)" volt-renderer.zip
